<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <h2>Robotics Club Management System</h2>
    <p class="text-muted">Welcome! Use the navigation bar above to manage the club.</p>

    <div class="row g-3 mt-3">
        <div class="col-md-4 col-lg-3" sec:authorize="hasAnyRole('ADMIN','MENTOR')">
            <div class="card text-center shadow-sm">
                <div class="card-body" >
                    <h5 class="card-title">Members</h5>
                    <p class="display-6" th:text="${memberCount}">0</p>
                    <a href="/members" class="btn btn-sm btn-primary">View Members</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg-3" sec:authorize="hasAnyRole('ADMIN','MENTOR')">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Equipment</h5>
                    <p class="display-6" th:text="${equipmentCount}">0</p>
                    <a href="/equipment" class="btn btn-sm btn-primary">View Equipment</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Projects</h5>
                    <p class="display-6" th:text="${projectCount}">0</p>
                    <a href="/projects" class="btn btn-sm btn-primary">View Projects</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Upcoming Events</h5>
                    <p class="display-6" th:text="${eventCount}">0</p>
                    <a href="/events" class="btn btn-sm btn-primary">View Events</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg-3" sec:authorize="hasAnyRole('ADMIN','MENTOR')">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Pending Requests</h5>
                    <p class="display-6">--</p>
<!--                    <p class="display-6" th:text="${requestCount}">0</p>-->
                    <a href="/requests" class="btn btn-sm btn-primary">View Requests</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Members</h2>
        <a href="/members/new" class="btn btn-primary">+ Add Member</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Year</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}">
            <td th:text="${member.studentId}"></td>
            <td th:text="${member.name}"></td>
            <td th:text="${member.email}"></td>
            <td th:text="${member.phone}"></td>
            <td th:text="${member.department}"></td>
            <td th:text="${member.year}"></td>
            <td>
                <span class="badge"
                      th:classappend="${member.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${member.status}"></span>
            </td>
            <td>
                <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/members/delete/{id}(id=${member.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this member?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(members)}">
            <td colspan="8" class="text-center text-muted">No members found.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

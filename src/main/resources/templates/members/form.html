<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Form - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <h2 th:text="${member.id} != null ? 'Edit Member' : 'Add Member'"></h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/members/save}" th:object="${member}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label class="form-label">Student ID</label>
            <input type="text" class="form-control" th:field="*{studentId}"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}"/>
        </div>

        <div class="col-md-6">
            <label class="form-label">Department</label>
            <input type="text" class="form-control" th:field="*{department}"/>
        </div>

        <div class="col-md-6">
            <label class="form-label">Year</label>
            <input type="number" min="1" max="5" class="form-control" th:field="*{year}"/>
        </div>

        <div class="col-md-6">
            <label class="form-label">Join Date</label>
            <input type="date" class="form-control" th:field="*{joinDate}"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('joinDate')}" th:errors="*{joinDate}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/members" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

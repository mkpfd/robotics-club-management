<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Form - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <h2 th:text="${event.id} != null ? 'Edit Event' : 'Add Event'"></h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/events/save}" th:object="${event}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label class="form-label">Event Name</label>
            <input type="text" class="form-control" list="eventNameSuggestions" th:field="*{eventName}"/>
            <datalist id="eventNameSuggestions">
                <option value="Robotics Workshop"></option>
                <option value="Club Meeting"></option>
                <option value="Robot Competition"></option>
                <option value="Training"></option>
            </datalist>
            <div class="text-danger small" th:if="${#fields.hasErrors('eventName')}" th:errors="*{eventName}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" th:field="*{location}"/>
        </div>

        <div class="col-md-6">
            <label class="form-label">Event Date</label>
            <input type="date"
                   class="form-control"
                   id="eventDate"
                   name="eventDate"
                   th:value="${#temporals.format(event.eventDate, 'yyyy-MM-dd')}">
            <div class="text-danger small" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Event Time</label>
            <input type="time" class="form-control" th:field="*{eventTime}"/>
        </div>

        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/events" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Events - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Events</h2>
        <div sec:authorize="hasAnyRole('ADMIN','MENTOR')">
            <a href="/events/new"
               class="btn btn-primary">
                + Add Event
            </a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Event Name</th>
            <th>Description</th>
            <th>Date</th>
            <th>Time</th>
            <th>Location</th>
            <th>Created By</th>
            <th sec:authorize="hasAnyRole('ADMIN','MENTOR')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.eventName}"></td>
            <td th:text="${event.description}"></td>
            <td th:text="${event.eventDate}"></td>
            <td th:text="${event.eventTime}"></td>
            <td th:text="${event.location}"></td>
            <td th:text="${event.createdBy != null ? event.createdBy.username : '-'}"></td>
            <td sec:authorize="hasAnyRole('ADMIN','MENTOR')">
                <a th:href="@{/events/edit/{id}(id=${event.id})}"
                   class="btn btn-sm btn-warning">
                    Edit
                </a>
                <a th:href="@{/events/delete/{id}(id=${event.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this event?');">
                    Delete
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(events)}">
            <td colspan="7" class="text-center text-muted">No events found.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

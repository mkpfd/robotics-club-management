<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>
        Attendance Form
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <h2>
        Mark Attendance
    </h2>

    <form th:action="@{/attendance/save}"
          th:object="${attendance}"
          method="post"
          class="row g-3">

        <input type="hidden"
               th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">
                Event
            </label>
            <!-- Temporary until Event module is ready -->
            <input type="text"
                   class="form-control"
                   placeholder="Event selection will be added">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Member
            </label>
            <!-- Temporary until dropdown connection -->
            <input type="text"
                   class="form-control"
                   placeholder="Member selection will be added">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Attendance Date
            </label>
            <input type="date"
                   class="form-control"
                   th:field="*{attendanceDate}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Status
            </label>
            <select class="form-select"
                    th:field="*{status}">
                <option value="PRESENT">
                    PRESENT
                </option>
                <option value="ABSENT">
                    ABSENT
                </option>
            </select>
        </div>

        <div class="col-12 mt-4">
            <button type="submit"
                    class="btn btn-primary">
                Save
            </button>
            <a href="/attendance"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"/>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>
        Attendance Form
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <h2>
        Mark Attendance
    </h2>

    <form th:action="@{/attendance/save}"
          th:object="${attendance}"
          method="post"
          class="row g-3">

        <input type="hidden"
               th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">
                Event
            </label>
            <select class="form-select"
                    th:field="*{event}"
                    id="eventSelect"
                    onchange="updateAttendanceDate()">
                <option value="">
                    Select Event
                </option>
                <option th:each="event : ${events}"
                        th:value="${event.id}"
                        th:text="${event.eventName}"
                        th:data-date="${event.eventDate}">
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Member
            </label>
            <select class="form-select"
                    th:field="*{member}">
                <option value="">
                    Select Member
                </option>
                <option th:each="member : ${members}"
                        th:value="${member.id}"
                        th:text="${member.name}">
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Attendance Date
            </label>
            <input type="date"
                   class="form-control"
                   th:field="*{attendanceDate}"
                   id="attendanceDate"
                   readonly>
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Status
            </label>
            <select class="form-select"
                    th:field="*{status}">
                <option value="PRESENT">
                    PRESENT
                </option>
                <option value="ABSENT">
                    ABSENT
                </option>
            </select>
        </div>

        <div class="col-12 mt-4">
            <button type="submit"
                    class="btn btn-primary">
                Save
            </button>
            <a href="/attendance"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>

</html>

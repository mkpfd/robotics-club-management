<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Attendance - Robotics Club Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Attendance</h2>

        <a href="/attendance/new"
           class="btn btn-primary">
            + Mark Attendance
        </a>
    </div>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Event</th>
            <th>Member</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

            <tr th:each="attendance : ${attendanceList}">

                <td th:text="${attendance.id}"></td>
                <td th:text="${attendance.event.eventName}"></td>
                <td th:text="${attendance.member.name}"></td>
                <td th:text="${attendance.attendanceDate}"></td>

                <td>
                    <span class="badge"
                          th:classappend="${attendance.status == 'PRESENT'}
                          ? 'bg-success'
                          : 'bg-danger'"
                          th:text="${attendance.status}">
                    </span>
                </td>

                <td>
                    <a th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                       class="btn btn-sm btn-warning">
                        Edit
                    </a>
                    <a th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this attendance record?');">
                        Delete
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(attendanceList)}">
                <td colspan="6" class="text-center text-muted">
                    No attendance records found.
                </td>
            </tr>

        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Equipment List - Robotics Club Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Equipment List</h2>

        <a th:href="@{/equipment/new}"
           class="btn btn-primary">
            Add Equipment
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Available</th>
            <th>Location</th>
            <th sec:authorize="hasAnyRole('ADMIN','MENTOR')">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipment : ${equipmentList}">
            <td th:text="${equipment.id}"></td>
            <td th:text="${equipment.name}"></td>
            <td th:text="${equipment.category}"></td>
            <td th:text="${equipment.quantity}"></td>
            <td th:text="${equipment.availableQuantity}"></td>
            <td th:text="${equipment.location}"></td>
            <td sec:authorize="hasAnyRole('ADMIN','MENTOR')">
                <a th:href="@{/equipment/edit/{id}(id=${equipment.id})}"
                   class="btn btn-sm btn-warning"
                >
                    Edit
                </a>
                <a th:href="@{/equipment/delete/{id}(id=${equipment.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this equipment?');">
                    Delete
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(equipmentList)}">
            <td colspan="7" class="text-center text-muted">No equipments found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

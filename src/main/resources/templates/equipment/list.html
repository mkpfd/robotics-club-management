<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Equipment List</title>
</head>

<body>

<h2>Equipment List</h2>

<a th:href="@{/equipment/new}">
    Add Equipment
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Available</th>
        <th>Location</th>
        <th>Action</th>
    </tr>

    <tr th:each="equipment : ${equipmentList}">

        <td th:text="${equipment.id}"></td>

        <td th:text="${equipment.name}"></td>

        <td th:text="${equipment.category}"></td>

        <td th:text="${equipment.quantity}"></td>

        <td th:text="${equipment.availableQuantity}"></td>

        <td th:text="${equipment.location}"></td>

        <td>

            <a th:href="@{/equipment/edit/{id}(id=${equipment.id})}">
                Edit
            </a>

            |

            <a th:href="@{/equipment/delete/{id}(id=${equipment.id})}">
                Delete
            </a>

        </td>

    </tr>

</table>

</body>
</html>

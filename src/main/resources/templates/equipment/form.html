<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Equipment Form</title>
</head>

<body>

<h2>Equipment Form</h2>

<form th:action="@{/equipment/save}" th:object="${equipment}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Name</label>

    <input type="text" th:field="*{name}">

    <br><br>

    <label>Category</label>

    <input type="text" th:field="*{category}">

    <br><br>

    <label>Quantity</label>

    <input type="number" th:field="*{quantity}">

    <br><br>

    <label>Available Quantity</label>

    <input type="number" th:field="*{availableQuantity}">

    <br><br>

    <label>Description</label>

    <textarea th:field="*{description}"></textarea>

    <br><br>

    <label>Location</label>

    <input type="text" th:field="*{location}">

    <br><br>

    <button type="submit">

        Save

    </button>

    <a th:href="@{/equipment}">

        Cancel

    </a>

</form>

</body>
</html>

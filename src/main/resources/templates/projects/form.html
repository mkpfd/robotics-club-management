<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Project Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <h2>Add Project</h2>

    <form th:action="@{/projects/save}"
          th:object="${project}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">
                Project Name
            </label>
            <input type="text"
                   class="form-control"
                   th:field="*{projectName}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Description
            </label>
            <textarea class="form-control"
                      th:field="*{description}">
            </textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Leader
            </label>
            <input type="text"
                   class="form-control"
                   th:field="*{leader}">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Status
            </label>

            <select class="form-select"
                    th:field="*{status}">
                <option value="PLANNED">
                    PLANNED
                </option>
                <option value="ONGOING">
                    ONGOING
                </option>
                <option value="COMPLETED">
                    COMPLETED
                </option>
            </select>
        </div>

        <button class="btn btn-primary">
            Save
        </button>
        <a href="/projects"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>
</div>

</body>
</html>

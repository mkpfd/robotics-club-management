<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipment Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Equipment Requests</h2>
        <a th:href="@{/requests/new}" class="btn btn-primary">+ New Request</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Member</th>
            <th>Equipment</th>
            <th>Qty</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.memberId}"></td>
            <td th:text="${r.equipmentId}"></td>
            <td th:text="${r.quantity}"></td>
            <td th:text="${r.reason}"></td>
            <td>
                <span class="badge"
                      th:classappend="${r.status == 'PENDING'} ? 'bg-warning text-dark' :
                            (${r.status == 'APPROVED'} ? 'bg-info text-dark' :
                            (${r.status == 'HANDED_OVER'} ? 'bg-primary' :
                            (${r.status == 'RETURNED'} ? 'bg-success' : 'bg-danger')))"
                            th:text="${r.status}">
                </span>
            </td>
            <td>
                <form th:if="${r.status == 'PENDING'}" th:action="@{/requests/{id}/approve(id=${r.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-success">Approve</button>
                </form>
                <form th:if="${r.status == 'PENDING'}" th:action="@{/requests/{id}/reject(id=${r.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger">Reject</button>
                </form>
                <form th:if="${r.status == 'APPROVED'}" th:action="@{/requests/{id}/handover(id=${r.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-primary">Hand Over</button>
                </form>
                <form th:if="${r.status == 'HANDED_OVER'}" th:action="@{/requests/{id}/return(id=${r.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-warning">Return</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="7" class="text-center text-muted py-4">No equipment requests yet.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<body style="font-family: Arial, sans-serif; margin: 30px;">
<h1>Equipment Requests</h1>
<a th:href="@{/requests/new}" style="display:inline-block; margin-bottom:15px; padding:8px 14px; background:#2563eb; color:white; text-decoration:none; border-radius:4px;">+ New Request</a>

<table style="border-collapse: collapse; width: 100%;">
    <tr style="background:#f1f5f9;">
        <th style="border:1px solid #ccc; padding:8px;">ID</th>
        <th style="border:1px solid #ccc; padding:8px;">Member</th>
        <th style="border:1px solid #ccc; padding:8px;">Equipment</th>
        <th style="border:1px solid #ccc; padding:8px;">Qty</th>
        <th style="border:1px solid #ccc; padding:8px;">Reason</th>
        <th style="border:1px solid #ccc; padding:8px;">Status</th>
        <th style="border:1px solid #ccc; padding:8px;">Actions</th>
    </tr>
    <tr th:each="r : ${requests}">
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.id}"></td>
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.memberId}"></td>
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.equipmentId}"></td>
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.quantity}"></td>
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.reason}"></td>
        <td style="border:1px solid #ccc; padding:8px;" th:text="${r.status}"></td>
        <td style="border:1px solid #ccc; padding:8px;">
            <form th:if="${r.status == 'PENDING'}" th:action="@{/requests/{id}/approve(id=${r.id})}" method="post" style="display:inline">
                <button style="background:#16a34a; color:white; border:none; padding:5px 10px; border-radius:4px;">Approve</button>
            </form>
            <form th:if="${r.status == 'PENDING'}" th:action="@{/requests/{id}/reject(id=${r.id})}" method="post" style="display:inline">
                <button style="background:#dc2626; color:white; border:none; padding:5px 10px; border-radius:4px;">Reject</button>
            </form>
            <form th:if="${r.status == 'APPROVED'}" th:action="@{/requests/{id}/handover(id=${r.id})}" method="post" style="display:inline">
                <button style="background:#2563eb; color:white; border:none; padding:5px 10px; border-radius:4px;">Hand Over</button>
            </form>
            <form th:if="${r.status == 'HANDED_OVER'}" th:action="@{/requests/{id}/return(id=${r.id})}" method="post" style="display:inline">
                <button style="background:#ea580c; color:white; border:none; padding:5px 10px; border-radius:4px;">Return</button>
            </form>
        </td>
    </tr>
</table>
</body>

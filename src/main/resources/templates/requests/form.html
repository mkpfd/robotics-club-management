<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Equipment Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Add Equipment Request</h2>

    <form th:action="@{/requests}" th:object="${request}" method="post">
        <div class="row g-4">

            <div class="col-md-6">
                <label class="form-label">Member ID</label>
                <input type="number" class="form-control" th:field="*{memberId}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Equipment ID</label>
                <input type="number" class="form-control" th:field="*{equipmentId}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" th:field="*{quantity}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Reason</label>
                <input type="text" class="form-control" th:field="*{reason}">
            </div>

        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/requests}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>

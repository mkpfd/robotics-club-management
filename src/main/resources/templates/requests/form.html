<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Equipment Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h4 class="card-title mb-4">New Equipment Request</h4>
            <form th:action="@{/requests}" th:object="${request}" method="post">

                <div class="mb-3">
                    <label class="form-label">Member ID</label>
                    <input type="number" class="form-control" th:field="*{memberId}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Equipment ID</label>
                    <input type="number" class="form-control" th:field="*{equipmentId}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" th:field="*{quantity}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <input type="text" class="form-control" th:field="*{reason}">
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/requests}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

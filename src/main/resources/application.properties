# ===== Application =====
spring.application.name=robotics-club-management
server.port=8080

# ===== MySQL Database =====
# Update the username/password below to match your local MySQL setup.
# Do NOT commit your real password to a shared/public repository.
spring.datasource.url=jdbc:mysql://localhost:3306/robotics_club?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" lets Hibernate create/update tables to match the entities.
# The database/robotics_club.sql file is still the source of truth for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false


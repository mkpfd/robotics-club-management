# Test-only configuration. Uses an in-memory H2 database instead of MySQL so the
# automated tests can run anywhere without needing a real MySQL server installed.
# This file is NOT used when running the real application (see src/main/resources).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
